# The live scenario (tools/perms-live.sh) on PumboProx and released Pumpkin
# servers, on every pull request and every push to main: three setups, each on
# four Pumpkin releases. Setups: proxy (PumboPerms on the proxy, servers without
# PumboBridge), pumpkin (PumboPerms on a lone Pumpkin) and bridge (PumboPerms on the
# proxy, PumboBridge and a passive PumboPerms on the servers). The proxy, its
# test network script and the bots come from PumboProx, branch main;
# PumboBridge and PumboBans from their main branches.
name: live

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Without debug info in test builds; with it the runner disk fills up.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  live:
    name: ${{ matrix.layout }}, Pumpkin ${{ matrix.pumpkin.tag }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        layout: [proxy, pumpkin, bridge]
        pumpkin:
          # variant: the plugin builds for that release (PUMBO_VARIANT).
          # old: the released PumboPerms 0.1.2-beta file that step J8 starts
          # first. 0.1.2-beta has no file for Pumpkin 0.2.2 and 0.2.1, so those
          # entries run the lone server steps without J8 (solo_steps). 0.2.2 has
          # the plugin API of 0.2.1 and loads its build.
          - tag: 0.2.2+26.3-26.60
            protocol: 777
            variant: '26.3'
            sha256: 3755df414cdece664223388a93421c5c674682f5b9264387416b8a9074cd8d59
            solo_steps: 'J1 J2 J3 J7 J4 J5 J6'
          - tag: 0.2.1+26.3-26.51
            protocol: 777
            variant: '26.3'
            sha256: bda0fcefe2f808c5d8fdf82a04326f5d77055322dfcd2900356e47e48f3dd56f
            solo_steps: 'J1 J2 J3 J7 J4 J5 J6'
          - tag: 0.2.0+26.3-26.51
            protocol: 777
            variant: '0.2.0'
            old: 'PumboPerms-Pumpkin-26.3-0.1.2-beta.wasm'
            sha256: 68c4416ca9fbfb3f2aeb6a8ce1de0e3fb02c5a85a53c8ba59a27941d7e43d8cd
          - tag: 0.1.0-dev+26.2-26.45
            protocol: 776
            variant: '26.2'
            old: 'PumboPerms-Pumpkin-26.2-0.1.2-beta.wasm'
            sha256: 565db1641b229d6a311d299f7a28c7e2d27b2f572480cfed36b930b0ae89ac11
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: plugin
      - uses: actions/checkout@v7.0.1
        with:
          repository: PumboMC/PumboProx
          ref: main
          path: prox
      - uses: actions/checkout@v7.0.1
        with:
          repository: PumboMC/PumboBridge
          ref: main
          path: bridge
      - uses: actions/checkout@v7.0.1
        with:
          repository: PumboMC/PumboBans
          ref: main
          path: bans
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal -t wasm32-wasip2
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            plugin
            prox
            bridge
            bans
      - name: Pumpkin ${{ matrix.pumpkin.tag }}
        env:
          TAG: ${{ matrix.pumpkin.tag }}
          SHA256: ${{ matrix.pumpkin.sha256 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pumpkin" \
            "https://github.com/Pumpkin-MC/Pumpkin/releases/download/${TAG//+/%2B}/pumpkin-X64-Linux"
          echo "$SHA256  $RUNNER_TEMP/pumpkin" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/pumpkin"
      # Step J8 starts the released 0.1.2-beta on the same data first.
      - name: 'PumboPerms 0.1.2-beta'
        if: matrix.layout == 'pumpkin' && matrix.pumpkin.old != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ matrix.pumpkin.old }}
        run: |
          gh release download v0.1.2-beta --repo PumboMC/PumboPerms --pattern "$FILE" --dir "$RUNNER_TEMP"
          grep -F "  $FILE" > "$RUNNER_TEMP/old.sha256" <<'EOF'
          b11ce58adc1b87da64383a0697c2f34c3493d3d793525d4bb2ebef348c686027  PumboPerms-Pumpkin-26.2-0.1.2-beta.wasm
          eb38421a3f318279d2069c7058ea3b099c242b2c0ac8b8c9fef133c75f97392a  PumboPerms-Pumpkin-26.3-0.1.2-beta.wasm
          EOF
          (cd "$RUNNER_TEMP" && sha256sum -c old.sha256)
      - name: Live scenario
        env:
          LAYOUT: ${{ matrix.layout }}
          PUMBO_PROTOCOL: ${{ matrix.pumpkin.protocol }}
          PUMBO_VARIANT: ${{ matrix.pumpkin.variant }}
          PUMPKIN_BIN: ${{ runner.temp }}/pumpkin
          OLD_PERMS_WASM: ${{ runner.temp }}/${{ matrix.pumpkin.old }}
          STEPS: ${{ matrix.pumpkin.solo_steps }}
          PUMBO_PROX_DIR: ${{ github.workspace }}/prox
          PUMBO_BRIDGE_DIR: ${{ github.workspace }}/bridge
          PUMBO_BANS_DIR: ${{ github.workspace }}/bans
        run: |
          if [ -n "$STEPS" ]; then export SOLO_STEPS=$STEPS; fi
          plugin/tools/perms-live.sh
      - name: Server logs
        if: failure()
        run: |
          shopt -s nullglob
          for f in prox/target/perms-live/*/console.log; do
            echo "::group::$f"
            tail -n 300 "$f"
            echo "::endgroup::"
          done
