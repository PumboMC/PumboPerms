# --- common ---
# Messages shared by all Pumbo plugins (English).
# Feedback messages get the plugin prefix and the colour of their tone (green
# success, red error, yellow warning, grey information) from the plugin, so they
# are written without either. & codes still work: &f...&r highlights a value, &r
# goes back to the colour of the tone. {0}, {1}, ... are arguments, {nl} starts a
# new line. An empty value disables a message. Forms separated by | depend on a
# number: "{0} day|{0} days".
command-no-permission: You don't have permission to do that.
command-unknown: Unknown subcommand {0}. Use {1}.
command-unknown-hover: Click to see the commands
command-usage: "Usage: {0}"
command-usage-hover: Click to type the command
command-players-only: Only players can use this command.
command-player-not-found: Player {0} was not found.
command-invalid-duration: "Invalid time {0}. Examples: &f30m&r, &f1d12h&r, &fperm"
command-reloaded: Configuration reloaded.
command-reload-failed: "Nothing was reloaded, a file has an error: {0}"
command-error: Something went wrong, see the server log.
command-help-empty: There are no commands you can use.
command-help-hint: Hover a command for details, click to type it.
command-help-previous: Previous page
command-help-next: Next page
command-help-permission: "Permission: {0}"
command-help-click: Click to type it in chat
version-description: Version and platform
version-platform: Platform
time-permanent: permanent
time-day: "{0} day|{0} days"
time-hour: "{0} hour|{0} hours"
time-minute: "{0} minute|{0} minutes"
time-second: "{0} second|{0} seconds"
number-separator: ","

# --- perms ---
# PumboPerms messages (English).
# Replies get the plugin prefix and the colour of their kind (green success, red
# error, grey information) from the plugin, so they are written without either.
# Values arrive highlighted; &r goes back to the colour of the reply.
# {0}, {name}: arguments. An empty value disables a message.

# help
help-section: Permissions

desc-user: Manage a player
desc-group: Manage a group
desc-track: Manage a track
desc-groups: List all groups
desc-tracks: List all tracks
desc-group-create: Create a group
desc-group-delete: Delete a group
desc-track-create: Create a track
desc-track-delete: Delete a track
desc-promote: Move a player up a track
desc-promote-details: "Example: /pp promote Steve staff"
desc-demote: Move a player down a track
desc-log: Recent changes
desc-export: Save all data to a file
desc-export-details: Writes exports/<file>.json in the plugin folder.
desc-import: Load all data from a file
desc-import-details: Replaces everything with exports/<file>.json. The current data is exported first.
desc-import-source: Take over another permission source (proxy, a plugin, attachments)
desc-editor: Web editor (planned)
desc-reload: Reload config and messages
desc-version: Version, storage and mode
desc-info: Groups, permissions and meta
desc-perm-info: List the permissions
desc-perm-set: Set a permission
desc-perm-set-details: "Example: permission set minecraft:command.gamemode true world=world"
desc-perm-settemp: Set a permission for a time
desc-perm-settemp-details: "Example: permission settemp fly true 1h30m"
desc-perm-unset: Remove a permission
desc-perm-unsettemp: Remove a temporary permission
desc-perm-check: Check a permission
desc-perm-check-details: Shows the value and which group and node decide it.
desc-perm-clear: Remove all permissions
desc-parent-info: List the parent groups
desc-parent-add: Inherit a group
desc-parent-add-details: "Example: parent add vip server=survival"
desc-parent-addtemp: Inherit a group for a time
desc-parent-remove: Stop inheriting a group
desc-parent-set: Make it the only parent
desc-parent-set-details: Removes the other parent groups in these contexts.
desc-meta-info: Prefixes, suffixes and meta
desc-meta-set: Set a meta value
desc-meta-unset: Remove a meta value
desc-meta-setprefix: Set the prefix
desc-meta-setprefix-details: "Replaces the other prefixes. Example: meta setprefix 100 \"&c[Admin] \""
desc-meta-addprefix: Add a prefix
desc-meta-addtempprefix: Add a prefix for a time
desc-meta-removeprefix: Remove prefixes
desc-meta-setsuffix: Set the suffix
desc-meta-addsuffix: Add a suffix
desc-meta-addtempsuffix: Add a suffix for a time
desc-meta-removesuffix: Remove suffixes
desc-user-promote: Move one group up a track
desc-user-demote: Move one group down a track
desc-user-clear: Remove everything
desc-group-rename: Rename the group
desc-group-setweight: Set the weight
desc-group-setweight-details: The group with the higher weight wins conflicts.
desc-group-setdisplayname: Set the shown name
desc-group-listmembers: List the members
desc-track-info: Groups of the track
desc-track-append: Add a group at the end
desc-track-insert: Add a group at a position
desc-track-remove: Remove a group from the track
desc-track-clear: Remove all groups

