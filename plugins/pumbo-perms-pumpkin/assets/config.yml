# ══════════════════════════════════════════════════════════════
#  PumboPerms · config.yml
#  Apply changes:  /pp reload  (check-event and commands: after a restart)
#  Groups, users and tracks are not here: /pp keeps them in perms.redb
#  Full reference: README.md → Configuration
# ══════════════════════════════════════════════════════════════

language: en                 # en | pl  (files in lang/)


# ── This server ───────────────────────────────────────────────
context:
  server: ""                 # nodes with server=<name> apply here (empty: never)
  group: ""                  # nodes with group=<name> apply here, for networks


# ── Operators ─────────────────────────────────────────────────
defaults:
  op-level: 3                # operators from this level may use /pp where no group decides (0 = off)


# ── Change log ────────────────────────────────────────────────
log:
  max-entries: 10000         # changes kept for /pp log (0 = unlimited)
  notify: true               # tell players with pumbo.perms.log.notify about changes


# ── Pumpkin ───────────────────────────────────────────────────
provider:
  check-event: false         # answer every permission check itself; testing only, see README
  resend-commands: true      # send the command list again after a change
  refresh-seconds: 5         # checks for expired nodes and new operator levels (commands check at once)


# ── Taking over other sources ─────────────────────────────────
import:
  enabled: true              # at start: the proxy's table (PumboBridge), the plugins below, or else attachments
  follow: false              # import a source again when it changes (otherwise once; /pp import run <source>)
                             # (`proxy` changes when the proxy reloads permissions.yml without PumboPerms there)
  plugins: []                # other plugins that answer {"op":"export-permissions"}


# ── Commands ──────────────────────────────────────────────────
commands:
  aliases: [pp]              # short commands for /pumboperms; [] = only /pumboperms
  disabled: []               # /pp subcommands to switch off, e.g. [editor, export]
